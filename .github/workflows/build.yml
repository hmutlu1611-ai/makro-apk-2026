           */
          class UsbCameraActivity : ComponentActivity() {

              private lateinit var surfaceView: SurfaceView
              private lateinit var statusText: TextView
              private val handler = Handler(Looper.getMainLooper())

              private var helper: Any? = null
              private var surface: Surface? = null
              private var cameraOpen = false
              private var surfaceAdded = false
              private var attachedSeen = false

              private lateinit var overlay: ImageView
              private lateinit var zoomLabel: TextView
              private lateinit var toolsPanel: View
              private lateinit var negBtn: Button
              private lateinit var embBtn: Button
              private val zoomSteps = listOf(1f, 2f, 3f, 5f, 10f, 15f, 20f, 25f, 30f, 35f, 40f, 45f, 50f)
