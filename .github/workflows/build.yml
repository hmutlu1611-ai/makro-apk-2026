              private var negative = false
              private var emboss = false
              private var previewBusy = false
              private var previewRunning = false

              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  setContentView(R.layout.activity_usb_camera)

                  surfaceView = findViewById(R.id.usbSurface)
                  statusText = findViewById(R.id.usbStatus)
                  findViewById<Button>(R.id.usbBackBtn).setOnClickListener { finish() }
                  findViewById<Button>(R.id.usbCaptureBtn).setOnClickListener { takePhoto() }

                  overlay = findViewById(R.id.usbOverlay)
                  zoomLabel = findViewById(R.id.usbZoomLabel)
                  toolsPanel = findViewById(R.id.usbToolsPanel)
                  negBtn = findViewById(R.id.usbNegBtn)
                  embBtn = findViewById(R.id.usbEmbBtn)
                  val toolsBtn = findViewById<Button>(R.id.usbToolsBtn)
                  toolsBtn.setOnClickListener {
                      if (toolsPanel.visibility == View.VISIBLE) {
                          toolsPanel.visibility = View.GONE
                          toolsBtn.text = "Menü"
                      } else {
                          toolsPanel.visibility = View.VISIBLE
                          toolsBtn.text = "Kapat"
                      }
                  }
                  findViewById<Button>(R.id.usbZoomInBtn).setOnClickListener { stepZoom(1) }
                  findViewById<Button>(R.id.usbZoomOutBtn).setOnClickListener { stepZoom(-1) }
                  negBtn.setOnClickListener {
                      negative = !negative
                      negBtn.text = if (negative) "Negatif: AÇIK" else "Negatif"
                      updateEffects()
                  }
                  embBtn.setOnClickListener {
                      emboss = !emboss
                      embBtn.text = if (emboss) "Kabartma: AÇIK" else "Kabartma"
                      updateEffects()
                  }

                  surfaceView.holder.addCallback(object : SurfaceHolder.Callback {
                      override fun surfaceCreated(h: SurfaceHolder) {
                          surface = h.surface
                          tryAddSurface()
                      }

                      override fun surfaceChanged(h: SurfaceHolder, format: Int, width: Int, height: Int) {}

                      override fun surfaceDestroyed(h: SurfaceHolder) {
                          removeSurface()
                          surface = null
                      }
                  })
              }

              override fun onStart() {
                  super.onStart()
                  initHelper()
                  previewBusy = false
                  if (negative || emboss) updateEffects()
              }

              override fun onStop() {
                  previewRunning = false
                  previewBusy = false
                  releaseHelper()
                  super.onStop()
              }

              private fun setStatus(text: String) {
                  runOnUiThread { statusText.text = text }
              }

              // ---------------------------------------------------------------- kütüphane

              private fun initHelper() {
                  try {
                      val helperClass = Class.forName("com.herohan.uvcapp.CameraHelper")
                      val cbClass = Class.forName("com.herohan.uvcapp.ICameraHelper\$StateCallback")
                      val h = helperClass.getDeclaredConstructor().newInstance()
                      helper = h

                      val proxy = Proxy.newProxyInstance(
                          cbClass.classLoader,
                          arrayOf(cbClass),
                          InvocationHandler { p, method, args -> onCallback(p, method, args) }
                      )

                      var set = false
                      for (m in h.javaClass.methods) {
                          if (m.name == "setStateCallback" && m.parameterTypes.size == 1) {
                              m.invoke(h, proxy)
                              set = true
                              break
                          }
                      }
                      if (!set) {
                          setStatus("Kütüphane uyumsuz: setStateCallback bulunamadı")
                          return
                      }

                      attachedSeen = false
                      setStatus("USB kamera aranıyor...")
                      handler.postDelayed({ fallbackSelect() }, 2500)
                  } catch (t: Throwable) {
                      val cause = t.cause ?: t
                      setStatus("USB kamera başlatılamadı: ${cause.javaClass.simpleName}: ${cause.message}")
                  }
              }

              private fun onCallback(proxy: Any, method: Method, args: Array<Any?>?): Any? {
                  when (method.name) {
                      "hashCode" -> return System.identityHashCode(proxy)
                      "equals" -> return proxy === args?.getOrNull(0)
                      "toString" -> return "UsbCameraCallback"
                      "onAttach" -> {
                          attachedSeen = true
                          setStatus("USB kamera algılandı. İzin sorusu çıkarsa 'İzin ver' deyin.")
                          call("selectDevice", args?.getOrNull(0))
                      }
                      "onDeviceOpen" -> {
                          setStatus("Cihaz açıldı, kamera başlatılıyor...")
                          call("openCamera")
                      }
                      "onCameraOpen" -> {
                          cameraOpen = true
                          setStatus("Görüntü başlatılıyor...")
                          call("startPreview")
                          runOnUiThread { tryAddSurface() }
                      }
                      "onCameraClose" -> {
                          cameraOpen = false
                          surfaceAdded = false
                          setStatus("Kamera kapandı")
                      }
                      "onDetach" -> setStatus("USB kamera çıkarıldı")
                      "onCancel" -> setStatus("İzin verilmedi. Kamerayı çıkarıp yeniden takın ve izni onaylayın.")
                  }
                  return null
              }

              /** Yardımcı nesnede ada ve parametre sayısına göre yöntem çağırır. */
              private fun call(name: String, vararg args: Any?): Any? {
                  val h = helper ?: return null
                  for (m in h.javaClass.methods) {
                      if (m.name == name && m.parameterTypes.size == args.size) {
                          return try {
                              m.invoke(h, *args)
                          } catch (t: Throwable) {
                              val cause = t.cause ?: t
                              setStatus("$name hatası: ${cause.message ?: cause.javaClass.simpleName}")
                              null
                          }
                      }
                  }
                  setStatus("Kütüphane uyumsuz: $name bulunamadı")
                  return null
              }

              private fun fallbackSelect() {
                  if (attachedSeen || helper == null) return
                  val list = call("getDeviceList") as? List<*>
                  if (list == null || list.isEmpty()) {
                      setStatus("USB kamera bulunamadı. OTG kabloyu ve kamerayı kontrol edin, sonra bu ekranı kapatıp tekrar açın.")
                  } else {
                      attachedSeen = true
                      setStatus("USB kamera algılandı. İzin sorusu çıkarsa 'İzin ver' deyin.")
                      call("selectDevice", list[0])
                  }
              }

              private fun tryAddSurface() {
                  val s = surface ?: return
                  if (!cameraOpen || surfaceAdded) return
                  call("addSurface", s, false)
                  surfaceAdded = true
                  setStatus("Canlı görüntü açık")
              }

              private fun removeSurface() {
                  val s = surface ?: return
                  if (surfaceAdded) {
                      call("removeSurface", s)
                      surfaceAdded = false
                  }
              }

              private fun releaseHelper() {
                  handler.removeCallbacksAndMessages(null)
                  removeSurface()
                  call("release")
                  helper = null
                  cameraOpen = false
                  surfaceAdded = false
                  attachedSeen = false
              }

              // ---------------------------------------------------------------- yakınlaştırma ve efektler

              private fun stepZoom(dir: Int) {
                  var idx = 0
                  for (i in zoomSteps.indices) {
                      if (zoomSteps[i] <= zoom + 0.01f) idx = i
                  }
                  idx = (idx + dir).coerceIn(0, zoomSteps.size - 1)
                  zoom = zoomSteps[idx]
                  surfaceView.scaleX = zoom
                  surfaceView.scaleY = zoom
                  overlay.scaleX = zoom
                  overlay.scaleY = zoom
                  zoomLabel.text = "${zoom.toInt()}x"
              }

              private fun negativeFilter(): ColorMatrixColorFilter {
                  val m = ColorMatrix(
                      floatArrayOf(
                          -1f, 0f, 0f, 0f, 255f,
                          0f, -1f, 0f, 0f, 255f,
                          0f, 0f, -1f, 0f, 255f,
                          0f, 0f, 0f, 1f, 0f
                      )
                  )
                  return ColorMatrixColorFilter(m)
              }

              private fun updateEffects() {
                  if (negative || emboss) {
                      overlay.colorFilter = if (negative) negativeFilter() else null
                      if (!previewRunning) {
                          previewRunning = true
                          handler.post { previewTick() }
                      }
                  } else {
                      previewRunning = false
                      overlay.visibility = View.GONE
                      overlay.setImageDrawable(null)
                  }
              }

              /** Canlı görüntüden küçük bir kare alıp efekt uygular ve üstte gösterir. */
              private fun previewTick() {
                  if (!previewRunning) return
                  if (!cameraOpen || surfaceView.width == 0 || surfaceView.height == 0 || previewBusy) {
                      handler.postDelayed({ previewTick() }, 200)
                      return
                  }
                  previewBusy = true
                  val w = 360
                  val h = (w.toLong() * surfaceView.height / surfaceView.width).toInt().coerceAtLeast(2)
                  val bmp = Bitmap.createBitmap(w, h, Bitmap.Config.ARGB_8888)
                  try {
                      PixelCopy.request(surfaceView, bmp, PixelCopy.OnPixelCopyFinishedListener { result ->
                          if (result == PixelCopy.SUCCESS && previewRunning) {
                              val shown = if (emboss) embossBitmap(bmp) else bmp
                              runOnUiThread {
                                  if (previewRunning) {
                                      overlay.setImageBitmap(shown)
                                      overlay.visibility = View.VISIBLE
                                  }
                              }
                          }
                          previewBusy = false
                          handler.postDelayed({ previewTick() }, 150)
                      }, handler)
                  } catch (t: Throwable) {
                      previewBusy = false
                      handler.postDelayed({ previewTick() }, 500)
                  }
              }

              private fun embossBitmap(src: Bitmap): Bitmap {
                  val w = src.width
                  val h = src.height
                  val px = IntArray(w * h)
                  src.getPixels(px, 0, w, 0, 0, w, h)
                  val gray = IntArray(w * h)
                  for (i in px.indices) {
                      val c = px[i]
                      gray[i] = (((c shr 16) and 0xFF) * 299 + ((c shr 8) and 0xFF) * 587 + (c and 0xFF) * 114) / 1000
                  }
                  for (y in 0 until h) {
                      val ym = if (y > 0) y - 1 else 0
                      val yp = if (y < h - 1) y + 1 else h - 1
                      for (x in 0 until w) {
                          val xm = if (x > 0) x - 1 else 0
                          val xp = if (x < w - 1) x + 1 else w - 1
                          val d = gray[ym * w + xm] - gray[yp * w + xp]
                          var v = 128 + d * 2
                          if (v < 0) v = 0 else if (v > 255) v = 255
                          px[y * w + x] = (0xFF shl 24) or (v shl 16) or (v shl 8) or v
                      }
                  }
                  val out = Bitmap.createBitmap(w, h, Bitmap.Config.ARGB_8888)
                  out.setPixels(px, 0, w, 0, 0, w, h)
                  return out
              }

              private fun invertBitmap(src: Bitmap): Bitmap {
                  val out = Bitmap.createBitmap(src.width, src.height, Bitmap.Config.ARGB_8888)
                  val paint = Paint()
                  paint.colorFilter = negativeFilter()
                  Canvas(out).drawBitmap(src, 0f, 0f, paint)
                  return out
              }

              // ---------------------------------------------------------------- fotoğraf

              /** Canlı görüntüyü PixelCopy ile alır; yakınlaştırma, kabartma ve negatif uygulayıp galeriye kaydeder. */
              private fun takePhoto() {
                  if (!cameraOpen || surfaceView.width == 0 || surfaceView.height == 0) {
                      Toast.makeText(this, "Önce canlı görüntünün açılmasını bekleyin", Toast.LENGTH_SHORT).show()
                      return
                  }
                  val bmp = Bitmap.createBitmap(surfaceView.width, surfaceView.height, Bitmap.Config.ARGB_8888)
                  val z = zoom
                  val neg = negative
                  val emb = emboss
                  try {
                      PixelCopy.request(surfaceView, bmp, PixelCopy.OnPixelCopyFinishedListener { result ->
                          if (result == PixelCopy.SUCCESS) {
                              Thread {
                                  try {
                                      var out = bmp
                                      if (z > 1.01f) {
                                          val cw = (bmp.width / z).toInt().coerceAtLeast(2)
                                          val ch = (bmp.height / z).toInt().coerceAtLeast(2)
                                          out = Bitmap.createBitmap(bmp, (bmp.width - cw) / 2, (bmp.height - ch) / 2, cw, ch)
                                      }
                                      if (emb) out = embossBitmap(out)
                                      if (neg) out = invertBitmap(out)
                                      saveBitmap(out)
                                  } catch (t: Throwable) {
                                      runOnUiThread {
                                          Toast.makeText(this, "Fotoğraf işlenemedi: ${t.message}", Toast.LENGTH_LONG).show()
                                      }
                                  }
                              }.start()
                          } else {
                              Toast.makeText(this, "Fotoğraf alınamadı (kod $result)", Toast.LENGTH_LONG).show()
                          }
                      }, handler)
                  } catch (t: Throwable) {
                      Toast.makeText(this, "Fotoğraf alınamadı: ${t.message}", Toast.LENGTH_LONG).show()
                  }
              }

              private fun saveBitmap(bmp: Bitmap) {
                  try {
                      val stamp = SimpleDateFormat("yyyyMMdd_HHmmss", Locale.US).format(System.currentTimeMillis())
                      val values = ContentValues()
                      values.put(MediaStore.MediaColumns.DISPLAY_NAME, "MAKRO_USB_$stamp.jpg")
                      values.put(MediaStore.MediaColumns.MIME_TYPE, "image/jpeg")
                      if (Build.VERSION.SDK_INT >= 29) {
                          values.put(MediaStore.MediaColumns.RELATIVE_PATH, "Pictures/MakroKamera")
                      }
                      val uri = contentResolver.insert(MediaStore.Images.Media.EXTERNAL_CONTENT_URI, values)
                      if (uri != null) {
                          contentResolver.openOutputStream(uri)?.use {
                              bmp.compress(Bitmap.CompressFormat.JPEG, 95, it)
                          }
                      }
                      runOnUiThread {
                          Toast.makeText(this, "Kaydedildi: Pictures/MakroKamera", Toast.LENGTH_SHORT).show()
                      }
                  } catch (t: Throwable) {
                      runOnUiThread {
                          Toast.makeText(this, "Kaydedilemedi: ${t.message}", Toast.LENGTH_LONG).show()
                      }
                  }
              }
          }
          EOF_MK
