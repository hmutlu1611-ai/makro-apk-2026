name: APK derle

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Proje dosyalarini olustur
        run: |
          cat > settings.gradle.kts <<'EOF_MK'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }

          rootProject.name = "MakroKamera"
          include(":app")
          EOF_MK
          cat > build.gradle.kts <<'EOF_MK'
          plugins {
              id("com.android.application") version "8.5.2" apply false
              id("org.jetbrains.kotlin.android") version "2.0.0" apply false
          }
          EOF_MK
          cat > gradle.properties <<'EOF_MK'
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          android.useAndroidX=true
          kotlin.code.style=official
          android.nonTransitiveRClass=true
          EOF_MK
          mkdir -p app
          cat > app/build.gradle.kts <<'EOF_MK'
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
          }

          android {
              namespace = "com.example.makrokamera"
              compileSdk = 34

              defaultConfig {
                  applicationId = "com.example.makrokamera"
                  minSdk = 24
                  targetSdk = 34
                  versionCode = 1
                  versionName = "1.0"
              }

              buildTypes {
                  release {
                      isMinifyEnabled = false
                  }
              }
              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
              kotlinOptions {
                  jvmTarget = "17"
              }
          }

          dependencies {
              val camerax = "1.3.4"
              implementation("androidx.core:core-ktx:1.13.1")
              implementation("androidx.activity:activity-ktx:1.9.1")
              implementation("androidx.camera:camera-core:$camerax")
              implementation("androidx.camera:camera-camera2:$camerax")
              implementation("androidx.camera:camera-lifecycle:$camerax")
              implementation("androidx.camera:camera-view:$camerax")
              implementation("com.google.android.gms:play-services-mlkit-document-scanner:16.0.0-beta1")
              implementation("com.herohan:UVCAndroid:1.0.13")
          }
          EOF_MK
          mkdir -p app/src/main
          cat > app/src/main/AndroidManifest.xml <<'EOF_MK'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <uses-permission android:name="android.permission.CAMERA" />
              <uses-feature
                  android:name="android.hardware.camera"
                  android:required="true" />
              <uses-feature
                  android:name="android.hardware.camera.autofocus"
                  android:required="false" />
              <uses-feature
                  android:name="android.hardware.camera.external"
                  android:required="false" />
              <uses-feature
                  android:name="android.hardware.usb.host"
                  android:required="false" />

              <application
                  android:allowBackup="true"
                  android:largeHeap="true"
                  android:label="Makro Kamera"
                  android:theme="@android:style/Theme.Material.NoActionBar">
                  <activity
                      android:name=".UsbCameraActivity"
                      android:configChanges="orientation|screenSize|smallestScreenSize|screenLayout|keyboard|keyboardHidden|navigation|uiMode|density|fontScale"
                      android:exported="false" />
                  <activity
                      android:name=".MainActivity"
                      android:configChanges="orientation|screenSize|smallestScreenSize|screenLayout|keyboard|keyboardHidden|navigation|uiMode|density|fontScale"
                      android:exported="true"
                      android:screenOrientation="portrait">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>

          </manifest>
          EOF_MK
          mkdir -p app/src/main/res/layout
          cat > app/src/main/res/layout/activity_main.xml <<'EOF_MK'
          <?xml version="1.0" encoding="utf-8"?>
          <FrameLayout xmlns:android="http://schemas.android.com/apk/res/android"
              android:layout_width="match_parent"
              android:layout_height="match_parent"
              android:background="@android:color/black">

              <androidx.camera.view.PreviewView
                  android:id="@+id/previewView"
                  android:layout_width="match_parent"
                  android:layout_height="match_parent" />

              <ImageView
                  android:id="@+id/embossView"
                  android:layout_width="match_parent"
                  android:layout_height="match_parent"
                  android:scaleType="centerCrop"
                  android:visibility="gone" />

              <View
                  android:id="@+id/focusRing"
                  android:layout_width="72dp"
                  android:layout_height="72dp"
                  android:background="@android:drawable/btn_radio"
                  android:visibility="gone" />

              <TextView
                  android:id="@+id/infoText"
                  android:layout_width="wrap_content"
                  android:layout_height="wrap_content"
                  android:layout_gravity="top|center_horizontal"
                  android:layout_marginTop="28dp"
                  android:background="#66000000"
                  android:paddingHorizontal="8dp"
                  android:paddingVertical="3dp"
                  android:textColor="@android:color/white"
                  android:textSize="11sp" />

              <LinearLayout
                  android:layout_width="match_parent"
                  android:layout_height="wrap_content"
                  android:layout_gravity="bottom"
                  android:background="#88000000"
                  android:orientation="vertical"
                  android:paddingHorizontal="6dp"
                  android:paddingVertical="4dp">

                  <!-- Araçlar paneli: "Menü" düğmesiyle açılır / kapanır -->
                  <LinearLayout
                      android:id="@+id/toolsPanel"
                      android:layout_width="match_parent"
                      android:layout_height="wrap_content"
                      android:orientation="vertical"
                      android:visibility="gone">

                      <LinearLayout
                          android:layout_width="match_parent"
                          android:layout_height="wrap_content"
                          android:gravity="center_vertical"
                          android:orientation="horizontal">

                          <Switch
                              android:id="@+id/manualSwitch"
                              android:layout_width="wrap_content"
                              android:layout_height="wrap_content"
                              android:text="Manuel  "
                              android:textColor="@android:color/white"
                              android:textSize="12sp" />

                          <SeekBar
                              android:id="@+id/focusSeek"
                              android:layout_width="0dp"
                              android:layout_height="wrap_content"
                              android:layout_weight="1"
                              android:enabled="false"
                              android:max="100" />
                      </LinearLayout>

                      <HorizontalScrollView
                          android:layout_width="match_parent"
                          android:layout_height="wrap_content"
                          android:scrollbars="none">

                          <LinearLayout
                              android:layout_width="wrap_content"
                              android:layout_height="wrap_content"
                              android:orientation="horizontal">

                              <Button
                                  android:id="@+id/switchCameraBtn"
                                  android:layout_width="wrap_content"
                                  android:layout_height="wrap_content"
                                  android:minWidth="0dp"
                                  android:minHeight="36dp"
                                  android:paddingHorizontal="10dp"
                                  android:text="Kamera"
                                  android:textSize="11sp" />

                              <Button
                                  android:id="@+id/externalBtn"
                                  android:layout_width="wrap_content"
                                  android:layout_height="wrap_content"
                                  android:minWidth="0dp"
                                  android:minHeight="36dp"
                                  android:paddingHorizontal="10dp"
                                  android:text="Harici"
                                  android:textSize="11sp" />

                              <Button
                                  android:id="@+id/macroBtn"
                                  android:layout_width="wrap_content"
                                  android:layout_height="wrap_content"
                                  android:minWidth="0dp"
                                  android:minHeight="36dp"
                                  android:paddingHorizontal="10dp"
                                  android:text="Makro"
                                  android:textSize="11sp" />

                              <Button
                                  android:id="@+id/torchBtn"
                                  android:layout_width="wrap_content"
                                  android:layout_height="wrap_content"
                                  android:minWidth="0dp"
                                  android:minHeight="36dp"
                                  android:paddingHorizontal="10dp"
                                  android:text="Işık"
                                  android:textSize="11sp" />

                              <Button
                                  android:id="@+id/negativeBtn"
                                  android:layout_width="wrap_content"
                                  android:layout_height="wrap_content"
                                  android:minWidth="0dp"
                                  android:minHeight="36dp"
                                  android:paddingHorizontal="10dp"
                                  android:text="Negatif"
                                  android:textSize="11sp" />

                              <Button
                                  android:id="@+id/embossBtn"
                                  android:layout_width="wrap_content"
                                  android:layout_height="wrap_content"
                                  android:minWidth="0dp"
                                  android:minHeight="36dp"
                                  android:paddingHorizontal="10dp"
                                  android:text="Kabartma"
                                  android:textSize="11sp" />

                              <Button
                                  android:id="@+id/scanBtn"
                                  android:layout_width="wrap_content"
                                  android:layout_height="wrap_content"
                                  android:minWidth="0dp"
                                  android:minHeight="36dp"
                                  android:paddingHorizontal="10dp"
                                  android:text="Belge"
                                  android:textSize="11sp" />
                          </LinearLayout>
                      </HorizontalScrollView>
                  </LinearLayout>

                  <!-- Ana satır: büyütme, çekim ve menü düğmesi -->
                  <LinearLayout
                      android:layout_width="match_parent"
                      android:layout_height="wrap_content"
                      android:gravity="center_vertical"
                      android:orientation="horizontal">

                      <Button
                          android:id="@+id/zoomOutBtn"
                          android:layout_width="44dp"
                          android:layout_height="40dp"
                          android:minWidth="0dp"
                          android:minHeight="0dp"
                          android:padding="0dp"
                          android:text="-"
                          android:textSize="20sp" />

                      <TextView
                          android:id="@+id/zoomLabel"
                          android:layout_width="0dp"
                          android:layout_height="wrap_content"
                          android:layout_weight="1"
                          android:gravity="center"
                          android:text="1.0x"
                          android:textColor="@android:color/white"
                          android:textSize="12sp" />

                      <Button
                          android:id="@+id/zoomInBtn"
                          android:layout_width="44dp"
                          android:layout_height="40dp"
                          android:minWidth="0dp"
                          android:minHeight="0dp"
                          android:padding="0dp"
                          android:text="+"
                          android:textSize="20sp" />

                      <Button
                          android:id="@+id/captureBtn"
                          android:layout_width="72dp"
                          android:layout_height="40dp"
                          android:layout_marginStart="8dp"
                          android:minWidth="0dp"
                          android:minHeight="0dp"
                          android:padding="0dp"
                          android:text="ÇEK"
                          android:textSize="13sp" />

                      <Button
                          android:id="@+id/toolsBtn"
                          android:layout_width="wrap_content"
                          android:layout_height="40dp"
                          android:layout_marginStart="4dp"
                          android:minWidth="0dp"
                          android:minHeight="0dp"
                          android:paddingHorizontal="10dp"
                          android:text="Menü"
                          android:textSize="11sp" />
                  </LinearLayout>
              </LinearLayout>
          </FrameLayout>
          EOF_MK
          mkdir -p app/src/main/java/com/example/makrokamera
          cat > app/src/main/java/com/example/makrokamera/MainActivity.kt <<'EOF_MK'
          package com.example.makrokamera

          import android.Manifest
          import android.content.ContentValues
          import android.content.Intent
          import android.content.pm.PackageManager
          import android.graphics.Bitmap
          import android.graphics.BitmapFactory
          import android.graphics.BitmapRegionDecoder
          import android.graphics.Canvas
          import android.graphics.ColorMatrix
          import android.graphics.ColorMatrixColorFilter
          import android.graphics.Matrix
          import android.graphics.Paint
          import android.graphics.Rect
          import android.hardware.camera2.CameraCharacteristics
          import android.hardware.camera2.CaptureRequest
          import android.media.ExifInterface
          import android.net.Uri
          import android.os.Build
          import android.os.Bundle
          import android.os.Handler
          import android.os.Looper
          import android.provider.MediaStore
          import android.view.MotionEvent
          import android.view.ScaleGestureDetector
          import android.view.TextureView
          import android.view.View
          import android.view.ViewGroup
          import android.widget.Button
          import android.widget.ImageView
          import android.widget.SeekBar
          import android.widget.Switch
          import android.widget.TextView
          import android.widget.Toast
          import androidx.activity.result.IntentSenderRequest
          import androidx.activity.result.contract.ActivityResultContracts
          import androidx.activity.ComponentActivity
          import androidx.camera.camera2.interop.Camera2CameraControl
          import androidx.camera.camera2.interop.Camera2CameraInfo
          import androidx.camera.camera2.interop.Camera2Interop
          import androidx.camera.camera2.interop.CaptureRequestOptions
          import androidx.camera.camera2.interop.ExperimentalCamera2Interop
          import androidx.camera.core.Camera
          import androidx.camera.core.CameraInfo
          import androidx.camera.core.CameraSelector
          import androidx.camera.core.FocusMeteringAction
          import androidx.camera.core.ImageCapture
          import androidx.camera.core.ImageCaptureException
          import androidx.camera.core.Preview
          import androidx.camera.core.resolutionselector.ResolutionSelector
          import androidx.camera.core.resolutionselector.ResolutionStrategy
          import androidx.camera.lifecycle.ProcessCameraProvider
          import androidx.camera.view.PreviewView
          import androidx.core.content.ContextCompat
          import com.google.mlkit.vision.documentscanner.GmsDocumentScannerOptions
          import com.google.mlkit.vision.documentscanner.GmsDocumentScanning
          import com.google.mlkit.vision.documentscanner.GmsDocumentScanningResult
          import java.text.SimpleDateFormat
          import java.util.Locale
          import java.util.concurrent.TimeUnit

          @OptIn(ExperimentalCamera2Interop::class)
          class MainActivity : ComponentActivity() {

              private lateinit var previewView: PreviewView
              private lateinit var embossView: ImageView
              private lateinit var focusRing: View
              private lateinit var infoText: TextView
              private lateinit var zoomLabel: TextView
              private lateinit var focusSeek: SeekBar
              private lateinit var manualSwitch: Switch
              private lateinit var negativeBtn: Button
              private lateinit var embossBtn: Button
              private lateinit var toolsPanel: View
              private lateinit var toolsBtn: Button

              private var provider: ProcessCameraProvider? = null
              private var camera: Camera? = null
              private var imageCapture: ImageCapture? = null

              private var backCameraIds: List<String> = emptyList()
              private var externalIds: Set<String> = emptySet()
              private var currentIndex = 0
              private var torchOn = false
              private var negative = false
              private var emboss = false

              private var minFocusDiopter = 0f

              // + ve - düğmelerinin geçeceği büyütme basamakları.
              private val zoomSteps = listOf(1f, 2f, 3f, 5f, 10f, 15f, 20f, 25f, 30f, 35f, 40f, 45f, 50f)

              // Toplam (donanım + yazılım) büyütme üst sınırı.
              private val maxQualityZoom = 50f

              // Bu değerin üstünde büyütme dijitaldir; ayrıntı kaybı başlar ve ekranda uyarı çıkar.
              private val sharpZoomLimit = 3f

              // Toplam istenen büyütme ve telefonun donanımının yetmediği kısım için yazılım büyütme çarpanı.
              private var totalZoom = 1f
              private var extraZoom = 1f

              private val handler = Handler(Looper.getMainLooper())
              private val refocusRunnable = Runnable { focusCenter() }

              private val embossRunnable = object : Runnable {
                  override fun run() {
                      if (!emboss) return
                      try {
                          val bmp = previewView.bitmap
                          if (bmp != null && bmp.width > 0 && bmp.height > 0) {
                              val w = 360
                              val h = maxOf(1, (w.toFloat() * bmp.height / bmp.width).toInt())
                              val small = Bitmap.createScaledBitmap(bmp, w, h, true)
                              val e = embossBitmap(small)
                              embossView.setImageBitmap(e)
                          }
                      } catch (t: Throwable) {
                          // Önizleme henüz hazır değilse bir sonraki turda tekrar denenir.
                      }
                      handler.postDelayed(this, 150)
                  }
              }

              private val permLauncher =
                  registerForActivityResult(ActivityResultContracts.RequestPermission()) { ok ->
                      if (ok) startCamera() else {
                          Toast.makeText(this, "Kamera izni gerekli", Toast.LENGTH_LONG).show()
                          finish()
                      }
                  }

              private val scannerLauncher =
                  registerForActivityResult(ActivityResultContracts.StartIntentSenderForResult()) { result ->
                      if (result.resultCode == android.app.Activity.RESULT_OK) {
                          val scan = GmsDocumentScanningResult.fromActivityResultIntent(result.data)
                          if (scan != null) saveScanResult(scan)
                      }
                  }

              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  setContentView(R.layout.activity_main)

                  previewView = findViewById(R.id.previewView)
                  embossView = findViewById(R.id.embossView)
                  focusRing = findViewById(R.id.focusRing)
                  infoText = findViewById(R.id.infoText)
                  zoomLabel = findViewById(R.id.zoomLabel)
                  focusSeek = findViewById(R.id.focusSeek)
                  manualSwitch = findViewById(R.id.manualSwitch)
                  negativeBtn = findViewById(R.id.negativeBtn)
                  embossBtn = findViewById(R.id.embossBtn)
                  toolsPanel = findViewById(R.id.toolsPanel)
                  toolsBtn = findViewById(R.id.toolsBtn)

                  previewView.implementationMode = PreviewView.ImplementationMode.COMPATIBLE
                  previewView.scaleType = PreviewView.ScaleType.FILL_CENTER

                  setupGestures()
                  setupControls()

                  if (ContextCompat.checkSelfPermission(this, Manifest.permission.CAMERA)
                      == PackageManager.PERMISSION_GRANTED
                  ) startCamera() else permLauncher.launch(Manifest.permission.CAMERA)
              }

              override fun onDestroy() {
                  handler.removeCallbacks(embossRunnable)
                  handler.removeCallbacks(refocusRunnable)
                  super.onDestroy()
              }

              private fun startCamera() {
                  val future = ProcessCameraProvider.getInstance(this)
                  future.addListener({
                      provider = future.get()
                      backCameraIds = rankCameras(provider!!)
                      if (backCameraIds.isEmpty()) {
                          Toast.makeText(this, "Kamera bulunamadı", Toast.LENGTH_LONG).show()
                          return@addListener
                      }
                      currentIndex = 0
                      bindCamera()
                  }, ContextCompat.getMainExecutor(this))
              }

              /** Arka kameralar (en yakına odaklanan önde), ardından USB ile bağlı harici kameralar. */
              private fun rankCameras(p: ProcessCameraProvider): List<String> {
                  val back = ArrayList<Pair<String, Float>>()
                  val ext = ArrayList<String>()
                  for (info in p.availableCameraInfos) {
                      val c2 = Camera2CameraInfo.from(info)
                      val facing = c2.getCameraCharacteristic(CameraCharacteristics.LENS_FACING)
                      if (facing == CameraCharacteristics.LENS_FACING_BACK) {
                          val diopter = c2.getCameraCharacteristic(
                              CameraCharacteristics.LENS_INFO_MINIMUM_FOCUS_DISTANCE
                          ) ?: 0f
                          back.add(Pair(c2.cameraId, diopter))
                      } else if (facing == CameraCharacteristics.LENS_FACING_EXTERNAL) {
                          ext.add(c2.cameraId)
                      }
                  }
                  externalIds = ext.toSet()
                  val sortedBack = back.sortedByDescending { it.second }.map { it.first }
                  return sortedBack + ext
              }

              private fun bindCamera() {
                  val p = provider ?: return
                  val id = backCameraIds[currentIndex]

                  val selector = CameraSelector.Builder()
                      .addCameraFilter { infos: List<CameraInfo> ->
                          infos.filter { Camera2CameraInfo.from(it).cameraId == id }
                      }.build()

                  val previewBuilder = Preview.Builder()
                  Camera2Interop.Extender(previewBuilder).apply {
                      setCaptureRequestOption(
                          CaptureRequest.CONTROL_AF_MODE,
                          CaptureRequest.CONTROL_AF_MODE_CONTINUOUS_PICTURE
                      )
                      setCaptureRequestOption(
                          CaptureRequest.LENS_OPTICAL_STABILIZATION_MODE,
                          CaptureRequest.LENS_OPTICAL_STABILIZATION_MODE_ON
                      )
                      setCaptureRequestOption(
                          CaptureRequest.EDGE_MODE, CaptureRequest.EDGE_MODE_HIGH_QUALITY
                      )
                      setCaptureRequestOption(
                          CaptureRequest.NOISE_REDUCTION_MODE,
                          CaptureRequest.NOISE_REDUCTION_MODE_HIGH_QUALITY
                      )
                  }
                  val preview = previewBuilder.build().also {
                      it.setSurfaceProvider(previewView.surfaceProvider)
                  }

                  val captureBuilder = ImageCapture.Builder()
                      .setCaptureMode(ImageCapture.CAPTURE_MODE_MAXIMIZE_QUALITY)
                      .setJpegQuality(100)
                      .setResolutionSelector(
                          ResolutionSelector.Builder()
                              .setResolutionStrategy(ResolutionStrategy.HIGHEST_AVAILABLE_STRATEGY)
                              .build()
                      )
                  Camera2Interop.Extender(captureBuilder).apply {
                      setCaptureRequestOption(
                          CaptureRequest.CONTROL_AF_MODE,
                          CaptureRequest.CONTROL_AF_MODE_CONTINUOUS_PICTURE
                      )
                      setCaptureRequestOption(
                          CaptureRequest.EDGE_MODE, CaptureRequest.EDGE_MODE_HIGH_QUALITY
                      )
                      setCaptureRequestOption(
                          CaptureRequest.NOISE_REDUCTION_MODE,
                          CaptureRequest.NOISE_REDUCTION_MODE_HIGH_QUALITY
                      )
                  }
                  imageCapture = captureBuilder.build()

                  p.unbindAll()
                  camera = p.bindToLifecycle(this, selector, preview, imageCapture)

                  val cam = camera!!
                  minFocusDiopter = Camera2CameraInfo.from(cam.cameraInfo).getCameraCharacteristic(
                      CameraCharacteristics.LENS_INFO_MINIMUM_FOCUS_DISTANCE
                  ) ?: 0f

                  cam.cameraInfo.zoomState.observe(this) { _ -> updateZoomLabel() }
                  totalZoom = 1f
                  setExtraZoom(1f)

                  manualSwitch.isChecked = false
                  focusSeek.isEnabled = false
                  torchOn = false

                  val closest = if (minFocusDiopter > 0f) (100f / minFocusDiopter) else Float.NaN
                  val title = if (externalIds.contains(id)) "Harici kamera" else "Kamera ${currentIndex + 1}/${backCameraIds.size}"
                  infoText.text = title +
                      if (closest.isNaN()) " • sabit odak" else " • en yakın odak ≈ %.1f cm".format(Locale.US, closest)
                  scheduleRefocus()

                  // Önizleme görünümü yeniden oluşabilir; negatif filtreyi biraz sonra tekrar uygula.
                  previewView.postDelayed({ applyNegative() }, 600)
              }

              private fun setupControls() {
                  toolsBtn.setOnClickListener {
                      val open = toolsPanel.visibility == View.VISIBLE
                      toolsPanel.visibility = if (open) View.GONE else View.VISIBLE
                      toolsBtn.text = if (open) "Menü" else "Kapat"
                  }

                  findViewById<Button>(R.id.zoomInBtn).setOnClickListener { stepZoom(true) }
                  findViewById<Button>(R.id.zoomOutBtn).setOnClickListener { stepZoom(false) }

                  manualSwitch.setOnCheckedChangeListener { _, checked ->
                      focusSeek.isEnabled = checked && minFocusDiopter > 0f
                      if (checked) applyManualFocus(focusSeek.progress) else restoreAutoFocus()
                  }

                  focusSeek.setOnSeekBarChangeListener(object : SeekBar.OnSeekBarChangeListener {
                      override fun onProgressChanged(s: SeekBar?, p: Int, fromUser: Boolean) {
                          if (fromUser && manualSwitch.isChecked) applyManualFocus(p)
                      }
                      override fun onStartTrackingTouch(s: SeekBar?) {}
                      override fun onStopTrackingTouch(s: SeekBar?) {}
                  })

                  findViewById<Button>(R.id.switchCameraBtn).setOnClickListener {
                      if (backCameraIds.size > 1) {
                          currentIndex = (currentIndex + 1) % backCameraIds.size
                          bindCamera()
                      } else Toast.makeText(this, "Tek kamera var", Toast.LENGTH_SHORT).show()
                  }

                  findViewById<Button>(R.id.externalBtn).setOnClickListener { useExternalCamera() }

                  findViewById<Button>(R.id.torchBtn).setOnClickListener {
                      val cam = camera ?: return@setOnClickListener
                      if (!cam.cameraInfo.hasFlashUnit()) return@setOnClickListener
                      torchOn = !torchOn
                      cam.cameraControl.enableTorch(torchOn)
                  }

                  findViewById<Button>(R.id.macroBtn).setOnClickListener {
                      val z = camera?.cameraInfo?.zoomState?.value ?: return@setOnClickListener
                      if (manualSwitch.isChecked) manualSwitch.isChecked = false
                      setTotalZoom(z.minZoomRatio)
                      scheduleRefocus()
                      val msg = if (z.minZoomRatio < 1f)
                          "Makro: en geniş mercek devrede. Nesneye 2-5 cm yaklaşın."
                      else
                          "Bu telefonda ayrı makro mercek görünmüyor. Nesneye yaklaşıp odaklanmasını bekleyin."
                      Toast.makeText(this, msg, Toast.LENGTH_LONG).show()
                  }

                  negativeBtn.setOnClickListener {
                      negative = !negative
                      negativeBtn.text = if (negative) "Negatif ✓" else "Negatif"
                      applyNegative()
                  }

                  embossBtn.setOnClickListener {
                      emboss = !emboss
                      embossBtn.text = if (emboss) "Kabartma ✓" else "Kabartma"
                      handler.removeCallbacks(embossRunnable)
                      if (emboss) {
                          embossView.visibility = View.VISIBLE
                          handler.post(embossRunnable)
                      } else {
                          embossView.visibility = View.GONE
                          embossView.setImageDrawable(null)
                      }
                  }

                  findViewById<Button>(R.id.scanBtn).setOnClickListener { startDocumentScan() }

                  findViewById<Button>(R.id.captureBtn).setOnClickListener { takePhoto() }
              }

              // ---------------------------------------------------------------- harici kamera

              /** USB (OTG) ile bağlı harici kameraya geçer. */
              private fun useExternalCamera() {
                  val ids = externalIds
                  if (ids.isNotEmpty()) {
                      val idx = backCameraIds.indexOf(ids.first())
                      if (idx >= 0) {
                          currentIndex = idx
                          bindCamera()
                          Toast.makeText(this, "Harici kamera seçildi", Toast.LENGTH_SHORT).show()
                          return
                      }
                  }

                  // Android bu kamerayı standart kamera olarak göstermiyorsa USB (UVC) ekranını aç.
                  startActivity(Intent(this, UsbCameraActivity::class.java))
              }

              // ---------------------------------------------------------------- belge tarama

              private fun startDocumentScan() {
                  val options = GmsDocumentScannerOptions.Builder()
                      .setGalleryImportAllowed(true)
                      .setPageLimit(20)
                      .setResultFormats(
                          GmsDocumentScannerOptions.RESULT_FORMAT_JPEG,
                          GmsDocumentScannerOptions.RESULT_FORMAT_PDF
                      )
                      .setScannerMode(GmsDocumentScannerOptions.SCANNER_MODE_FULL)
                      .build()
                  GmsDocumentScanning.getClient(options)
                      .getStartScanIntent(this)
                      .addOnSuccessListener { sender ->
                          scannerLauncher.launch(IntentSenderRequest.Builder(sender).build())
                      }
                      .addOnFailureListener { e ->
                          Toast.makeText(this, "Belge tarayıcı açılamadı: ${e.message}", Toast.LENGTH_LONG).show()
                      }
              }

              /** Taranan sayfaları galeriye (JPEG) ve indirilenlere (PDF) kaydeder. */
              private fun saveScanResult(scan: GmsDocumentScanningResult) {
                  Thread {
                      try {
                          val stamp = SimpleDateFormat("yyyyMMdd_HHmmss", Locale.US).format(System.currentTimeMillis())
                          var saved = 0

                          val pages = scan.pages
                          if (pages != null) {
                              var i = 1
                              for (page in pages) {
                                  val values = ContentValues()
                                  values.put(MediaStore.MediaColumns.DISPLAY_NAME, "BELGE_${stamp}_$i.jpg")
                                  values.put(MediaStore.MediaColumns.MIME_TYPE, "image/jpeg")
                                  if (Build.VERSION.SDK_INT >= 29) {
                                      values.put(MediaStore.MediaColumns.RELATIVE_PATH, "Pictures/MakroKamera")
                                  }
                                  val outUri = contentResolver.insert(MediaStore.Images.Media.EXTERNAL_CONTENT_URI, values)
                                  if (outUri != null) {
                                      contentResolver.openInputStream(page.imageUri)?.use { input ->
                                          contentResolver.openOutputStream(outUri)?.use { output ->
                                              input.copyTo(output)
                                          }
                                      }
                                      saved++
                                  }
                                  i++
                              }
                          }

                          var pdfSaved = false
                          val pdf = scan.pdf
                          if (pdf != null && Build.VERSION.SDK_INT >= 29) {
                              val values = ContentValues()
                              values.put(MediaStore.MediaColumns.DISPLAY_NAME, "BELGE_$stamp.pdf")
                              values.put(MediaStore.MediaColumns.MIME_TYPE, "application/pdf")
                              values.put(MediaStore.MediaColumns.RELATIVE_PATH, "Download/MakroKamera")
                              val outUri = contentResolver.insert(MediaStore.Downloads.EXTERNAL_CONTENT_URI, values)
                              if (outUri != null) {
                                  contentResolver.openInputStream(pdf.uri)?.use { input ->
                                      contentResolver.openOutputStream(outUri)?.use { output ->
                                          input.copyTo(output)
                                      }
                                  }
                                  pdfSaved = true
                              }
                          }

                          val msg = "Belge kaydedildi: $saved sayfa (Pictures/MakroKamera)" +
                              if (pdfSaved) ", PDF (Download/MakroKamera)" else ""
                          runOnUiThread { Toast.makeText(this, msg, Toast.LENGTH_LONG).show() }
                      } catch (t: Throwable) {
                          runOnUiThread {
                              Toast.makeText(this, "Belge kaydedilemedi: ${t.message}", Toast.LENGTH_LONG).show()
                          }
                      }
                  }.start()
              }

              // ---------------------------------------------------------------- büyütme

              /** + / - düğmeleri: 1, 2, 3, 5, 10, 15 ... 50x basamaklarında geçiş yapar. */
              private fun stepZoom(up: Boolean) {
                  val z = camera?.cameraInfo?.zoomState?.value ?: return
                  val cur = totalZoom
                  val target = if (up) {
                      zoomSteps.firstOrNull { it > cur + 0.01f } ?: zoomSteps.last()
                  } else {
                      zoomSteps.lastOrNull { it < cur - 0.01f } ?: z.minZoomRatio
                  }
                  setTotalZoom(target)
                  scheduleRefocus()
              }

              /**
               * Toplam büyütmeyi ayarlar. Telefonun donanımı yetiyorsa gerçek (kameranın) büyütmesi kullanılır,
               * yetmeyen kısım ekranda yazılımla (kırpıp büyüterek) tamamlanır.
               */
              private fun setTotalZoom(total: Float) {
                  val z = camera?.cameraInfo?.zoomState?.value ?: return
                  val t = total.coerceIn(z.minZoomRatio, maxQualityZoom)
                  totalZoom = t
                  if (t <= z.maxZoomRatio) {
                      camera?.cameraControl?.setZoomRatio(t)
                      setExtraZoom(1f)
                  } else {
                      camera?.cameraControl?.setZoomRatio(z.maxZoomRatio)
                      setExtraZoom(t / z.maxZoomRatio)
                  }
              }

              private fun setExtraZoom(v: Float) {
                  extraZoom = v
                  previewView.scaleX = v
                  previewView.scaleY = v
                  embossView.scaleX = v
                  embossView.scaleY = v
                  updateZoomLabel()
              }

              private fun updateZoomLabel() {
                  val hw = camera?.cameraInfo?.zoomState?.value?.maxZoomRatio ?: 1f
                  val warn = when {
                      extraZoom > 1.01f -> " ⚠ yazılım"
                      totalZoom > sharpZoomLimit -> " ⚠ dijital"
                      else -> ""
                  }
                  zoomLabel.text = "%.1fx (gerçek maks %.1fx)%s".format(Locale.US, totalZoom, hw, warn)
              }

              // ---------------------------------------------------------------- negatif ve kabartma

              private fun negativeFilter(): ColorMatrixColorFilter {
                  val m = ColorMatrix(
                      floatArrayOf(
                          -1f, 0f, 0f, 0f, 255f,
                          0f, -1f, 0f, 0f, 255f,
                          0f, 0f, -1f, 0f, 255f,
                          0f, 0f, 0f, 1f, 0f
                      )
                  )
                  return ColorMatrixColorFilter(m)
              }

              private fun findTextureView(v: View): TextureView? {
                  if (v is TextureView) return v
                  if (v is ViewGroup) {
                      for (i in 0 until v.childCount) {
                          val found = findTextureView(v.getChildAt(i))
                          if (found != null) return found
                      }
                  }
                  return null
              }

              private fun applyNegative() {
                  val tv = findTextureView(previewView)
                  val target: View = tv ?: previewView
                  if (tv != null) previewView.setLayerType(View.LAYER_TYPE_NONE, null)
                  if (negative) {
                      val paint = Paint()
                      paint.colorFilter = negativeFilter()
                      target.setLayerType(View.LAYER_TYPE_HARDWARE, paint)
                      val paint2 = Paint()
                      paint2.colorFilter = negativeFilter()
                      embossView.setLayerType(View.LAYER_TYPE_HARDWARE, paint2)
                  } else {
                      target.setLayerType(View.LAYER_TYPE_NONE, null)
                      embossView.setLayerType(View.LAYER_TYPE_NONE, null)
                  }
              }

              /** Kabartma (emboss) süzgeci: köşegen komşu piksel farkı alınır, gri 128 etrafında gösterilir. */
              private fun embossBitmap(src: Bitmap): Bitmap {
                  val w = src.width
                  val h = src.height
                  val px = IntArray(w * h)
                  src.getPixels(px, 0, w, 0, 0, w, h)
                  val gray = IntArray(w * h)
                  for (i in px.indices) {
                      val c = px[i]
                      gray[i] = (((c shr 16) and 0xFF) * 299 + ((c shr 8) and 0xFF) * 587 + (c and 0xFF) * 114) / 1000
                  }
                  for (y in 0 until h) {
                      val ym = if (y > 0) y - 1 else 0
                      val yp = if (y < h - 1) y + 1 else h - 1
                      for (x in 0 until w) {
                          val xm = if (x > 0) x - 1 else 0
                          val xp = if (x < w - 1) x + 1 else w - 1
                          val d = gray[ym * w + xm] - gray[yp * w + xp]
                          var v = 128 + d * 2
                          if (v < 0) v = 0 else if (v > 255) v = 255
                          px[y * w + x] = (0xFF shl 24) or (v shl 16) or (v shl 8) or v
                      }
                  }
                  val out = Bitmap.createBitmap(w, h, Bitmap.Config.ARGB_8888)
                  out.setPixels(px, 0, w, 0, 0, w, h)
                  return out
              }

              /**
               * Çekilen fotoğraftan işlenmiş bir kopya kaydeder:
               *  - crop > 1 ise ortadaki bölgeyi kırpar (yazılım büyütme; piksel eklenmez, gerçek ayrıntı korunur),
               *  - emb true ise kabartma uygular,
               *  - neg true ise renkleri ters çevirir.
               */
              private fun saveProcessedCopy(uri: Uri, crop: Float, neg: Boolean, emb: Boolean) {
                  Thread {
                      try {
                          val bounds = BitmapFactory.Options()
                          bounds.inJustDecodeBounds = true
                          contentResolver.openInputStream(uri)?.use { BitmapFactory.decodeStream(it, null, bounds) }
                          val w = bounds.outWidth
                          val h = bounds.outHeight
                          val cw = maxOf(1, (w / crop).toInt())
                          val ch = maxOf(1, (h / crop).toInt())
                          val left = (w - cw) / 2
                          val top = (h - ch) / 2
                          val rect = Rect(left, top, left + cw, top + ch)

                          val cap = if (emb) 3072 else 4096
                          var sample = 1
                          while (maxOf(cw, ch) / sample > cap) sample *= 2
                          val opts = BitmapFactory.Options()
                          opts.inSampleSize = sample

                          val src: Bitmap = contentResolver.openInputStream(uri)?.use { stream ->
                              val decoder = BitmapRegionDecoder.newInstance(stream, false)
                              val bmp = decoder?.decodeRegion(rect, opts)
                              decoder?.recycle()
                              bmp
                          } ?: return@Thread

                          var degrees = 0
                          contentResolver.openInputStream(uri)?.use {
                              val exif = ExifInterface(it)
                              val o = exif.getAttributeInt(
                                  ExifInterface.TAG_ORIENTATION, ExifInterface.ORIENTATION_NORMAL
                              )
                              degrees = when (o) {
                                  ExifInterface.ORIENTATION_ROTATE_90 -> 90
                                  ExifInterface.ORIENTATION_ROTATE_180 -> 180
                                  ExifInterface.ORIENTATION_ROTATE_270 -> 270
                                  else -> 0
                              }
                          }

                          var cur: Bitmap = if (degrees != 0) {
                              val matrix = Matrix()
                              matrix.postRotate(degrees.toFloat())
                              val r = Bitmap.createBitmap(src, 0, 0, src.width, src.height, matrix, true)
                              src.recycle()
                              r
                          } else src

                          if (emb) {
                              val e = embossBitmap(cur)
                              cur.recycle()
                              cur = e
                          }

                          val result: Bitmap = if (neg) {
                              val out = Bitmap.createBitmap(cur.width, cur.height, Bitmap.Config.ARGB_8888)
                              val paint = Paint()
                              paint.colorFilter = negativeFilter()
                              Canvas(out).drawBitmap(cur, 0f, 0f, paint)
                              cur.recycle()
                              out
                          } else cur

                          val stamp = SimpleDateFormat("yyyyMMdd_HHmmss", Locale.US).format(System.currentTimeMillis())
                          val tag = (if (crop > 1.01f) "ZOOM_" else "") +
                              (if (emb) "EMB_" else "") + (if (neg) "NEG_" else "")
                          val values = ContentValues()
                          values.put(MediaStore.MediaColumns.DISPLAY_NAME, "MAKRO_$tag$stamp.jpg")
                          values.put(MediaStore.MediaColumns.MIME_TYPE, "image/jpeg")
                          if (Build.VERSION.SDK_INT >= 29) {
                              values.put(MediaStore.MediaColumns.RELATIVE_PATH, "Pictures/MakroKamera")
                          }
                          val outUri = contentResolver.insert(MediaStore.Images.Media.EXTERNAL_CONTENT_URI, values)
                          if (outUri != null) {
                              contentResolver.openOutputStream(outUri)?.use {
                                  result.compress(Bitmap.CompressFormat.JPEG, 100, it)
                              }
                          }
                          result.recycle()
                          runOnUiThread {
                              Toast.makeText(this, "İşlenmiş kopya kaydedildi (MAKRO_$tag...)", Toast.LENGTH_SHORT).show()
                          }
                      } catch (e: Throwable) {
                          runOnUiThread {
                              Toast.makeText(this, "Kopya kaydedilemedi: ${e.message}", Toast.LENGTH_LONG).show()
                          }
                      }
                  }.start()
              }

              // ---------------------------------------------------------------- odak

              /** Ekranın ortasına otomatik netleme tetikler; 3 sn sonra sürekli otomatik odağa döner. */
              private fun focusCenter() {
                  val cam = camera ?: return
                  if (manualSwitch.isChecked) return
                  if (previewView.width == 0 || previewView.height == 0) return
                  val point = previewView.meteringPointFactory.createPoint(
                      previewView.width / 2f, previewView.height / 2f
                  )
                  val action = FocusMeteringAction.Builder(
                      point, FocusMeteringAction.FLAG_AF or FocusMeteringAction.FLAG_AE
                  ).setAutoCancelDuration(3, TimeUnit.SECONDS).build()
                  cam.cameraControl.startFocusAndMetering(action)
              }

              /** Yakınlaştırma durunca yarım saniye sonra yeniden netler. */
              private fun scheduleRefocus() {
                  handler.removeCallbacks(refocusRunnable)
                  handler.postDelayed(refocusRunnable, 500)
              }

              private fun applyManualFocus(progress: Int) {
                  val cam = camera ?: return
                  if (minFocusDiopter <= 0f) return
                  val diopter = minFocusDiopter * progress / 100f
                  Camera2CameraControl.from(cam.cameraControl).setCaptureRequestOptions(
                      CaptureRequestOptions.Builder()
                          .setCaptureRequestOption(
                              CaptureRequest.CONTROL_AF_MODE, CaptureRequest.CONTROL_AF_MODE_OFF
                          )
                          .setCaptureRequestOption(CaptureRequest.LENS_FOCUS_DISTANCE, diopter)
                          .build()
                  )
              }

              private fun restoreAutoFocus() {
                  val cam = camera ?: return
                  Camera2CameraControl.from(cam.cameraControl).setCaptureRequestOptions(
                      CaptureRequestOptions.Builder()
                          .setCaptureRequestOption(
                              CaptureRequest.CONTROL_AF_MODE,
                              CaptureRequest.CONTROL_AF_MODE_CONTINUOUS_PICTURE
                          )
                          .build()
                  )
              }

              // ---------------------------------------------------------------- dokunma + tutam

              private fun setupGestures() {
                  val scaleDetector = ScaleGestureDetector(this,
                      object : ScaleGestureDetector.SimpleOnScaleGestureListener() {
                          override fun onScale(d: ScaleGestureDetector): Boolean {
                              setTotalZoom(totalZoom * d.scaleFactor)
                              return true
                          }

                          override fun onScaleEnd(d: ScaleGestureDetector) {
                              scheduleRefocus()
                          }
                      })

                  previewView.setOnTouchListener { v, e ->
                      scaleDetector.onTouchEvent(e)
                      if (e.action == MotionEvent.ACTION_UP && e.pointerCount == 1 &&
                          !scaleDetector.isInProgress && e.eventTime - e.downTime < 300
                      ) {
                          tapToFocus(e.x, e.y)
                          v.performClick()
                      }
                      true
                  }
              }

              private fun tapToFocus(x: Float, y: Float) {
                  val cam = camera ?: return
                  if (manualSwitch.isChecked) manualSwitch.isChecked = false

                  val point = previewView.meteringPointFactory.createPoint(x, y)
                  val action = FocusMeteringAction.Builder(
                      point, FocusMeteringAction.FLAG_AF or FocusMeteringAction.FLAG_AE
                  ).setAutoCancelDuration(4, TimeUnit.SECONDS).build()
                  cam.cameraControl.startFocusAndMetering(action)

                  // Yazılım büyütmede önizleme ölçeklendiği için halkanın yerini ekran koordinatına çevir.
                  val cx = previewView.width / 2f
                  val cy = previewView.height / 2f
                  val rx = cx + (x - cx) * extraZoom
                  val ry = cy + (y - cy) * extraZoom
                  focusRing.x = rx - focusRing.width / 2f
                  focusRing.y = ry - focusRing.height / 2f
                  focusRing.visibility = View.VISIBLE
                  focusRing.postDelayed({ focusRing.visibility = View.GONE }, 900)
              }

              // ---------------------------------------------------------------- çekim

              private fun takePhoto() {
                  val capture = imageCapture ?: return
                  val cropNow = extraZoom
                  val negNow = negative
                  val embNow = emboss
                  val name = SimpleDateFormat("yyyyMMdd_HHmmss", Locale.US).format(System.currentTimeMillis())
                  val values = ContentValues()
                  values.put(MediaStore.MediaColumns.DISPLAY_NAME, "MAKRO_$name.jpg")
                  values.put(MediaStore.MediaColumns.MIME_TYPE, "image/jpeg")
                  if (Build.VERSION.SDK_INT >= 29) {
                      values.put(MediaStore.MediaColumns.RELATIVE_PATH, "Pictures/MakroKamera")
                  }
                  val options = ImageCapture.OutputFileOptions.Builder(
                      contentResolver, MediaStore.Images.Media.EXTERNAL_CONTENT_URI, values
                  ).build()

                  capture.takePicture(options, ContextCompat.getMainExecutor(this),
                      object : ImageCapture.OnImageSavedCallback {
                          override fun onImageSaved(r: ImageCapture.OutputFileResults) {
                              Toast.makeText(this@MainActivity, "Kaydedildi: Pictures/MakroKamera", Toast.LENGTH_SHORT).show()
                              val saved = r.savedUri
                              if (saved != null && (negNow || embNow || cropNow > 1.01f)) {
                                  saveProcessedCopy(saved, cropNow, negNow, embNow)
                              }
                          }
                          override fun onError(e: ImageCaptureException) {
                              Toast.makeText(this@MainActivity, "Hata: ${e.message}", Toast.LENGTH_LONG).show()
                          }
                      })
              }
          }
